<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<link rel="icon" href="__FAVICON__">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Design 3 ("glide"): layout reproduced from goflex.com's homepage. Content, images and colors come from window.DEMO. -->
<style>
:root{
  --accent:#2360f9;            /* buttons, links (settings.colors.accent) */
  --ink:#111827;               /* headings */
  --body:#4b5563;              /* body copy */
  --line:#e5e7eb;
  --mist:#f9fafb;              /* section background */
  --sand:#f5f5f2;              /* blog cards */
  --nav-ink:#0e121b;
  --gutter:clamp(1rem, .6667rem + 1.6667vw, 2rem);
  --pad-l:clamp(2.5rem, .6667rem + 9.1667vw, 8rem);
  --pad-m:clamp(2rem, 1.1429rem + 4.2857vw, 5rem);
  --pad-hero:clamp(4rem, 1.9286rem + 10.357vw, 11.25rem);
  --pill-pink:#fd6ab3; --pill-cyan:#87e9e8; --pill-yellow:#fbcc1a; --pill-green:#22c45e;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"DM Sans",sans-serif;font-size:16px;line-height:24px;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,p{margin:0}
button,input{font:inherit}
html,main,footer{overflow-x:clip}
.wrap{padding:0 var(--gutter)}
.container{max-width:80rem;margin:0 auto}
main{background:var(--mist)}

/* ===== Nav ===== */
.nav{position:fixed;z-index:50;top:16px;left:0;right:0;padding:0 var(--gutter);pointer-events:none}
.nav-inner{pointer-events:auto;max-width:80rem;height:64px;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 var(--gutter);border-radius:20px;transition:background .3s,box-shadow .3s}
.nav-inner::before{content:"";position:absolute;inset:0;border-radius:20px;background:#fff;opacity:0;transition:opacity .3s;z-index:-1}
.nav.solid .nav-inner::before{opacity:1}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0;height:40px}
.logo img{height:32px;width:auto;max-width:220px;object-fit:contain}
.logo .on-dark,.logo .on-light{display:flex;align-items:center;gap:10px}
.logo .on-light{display:none}
.nav.solid .logo .on-dark{display:none}
.nav.solid .logo .on-light{display:flex}
.logo .mark{width:34px;height:34px;flex:none}
.logo .mark svg{width:100%;height:100%;display:block}
.logo .word{font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.solid .logo{color:var(--nav-ink)}
.menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center}
.menu>.item{position:relative}
.nav-link{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;line-height:21px;color:#fff;text-decoration:none;background:none;border:0;cursor:pointer;white-space:nowrap;transition:background .2s}
.nav-link svg{width:20px;height:20px}
.nav.solid .nav-link{color:var(--nav-ink)}
.menu>.item:hover>.nav-link{background:rgba(255,255,255,.2)}
.nav.solid .menu>.item:hover>.nav-link{background:#f3f4f6}
.drop{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(17,24,39,.14);padding:8px;opacity:0;visibility:hidden;transform:translateY(6px);transition:all .2s}
.drop::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.menu>.item:hover .drop,.menu>.item:focus-within .drop{opacity:1;visibility:visible;transform:none}
.drop a{display:block;padding:9px 12px;border-radius:10px;font-size:14px;line-height:20px;color:var(--nav-ink);text-decoration:none}
.drop a:hover{background:#f3f4f6}
.nav-right{display:flex;align-items:center;gap:4px}
.phone-pill{display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 10px;border-radius:999px;background:#eee;color:#000;font-size:14px;line-height:21px;text-decoration:none;white-space:nowrap}
.burger{display:none;width:40px;height:40px;border:0;border-radius:16px;background:none;color:#fff;cursor:pointer;align-items:center;justify-content:center}
.burger svg{width:24px;height:24px}
.nav.solid .burger{color:var(--nav-ink)}
.mnav{display:none}

/* ===== Hero ===== */
.hero{position:relative;max-width:95%;margin:0 auto;border-radius:0 0 2rem 2rem;overflow:hidden;background:var(--mist)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(10,13,18,.62) 0%,rgba(10,13,18,.38) 45%,rgba(10,13,18,0) 75%),linear-gradient(180deg,rgba(10,13,18,.35),rgba(10,13,18,0) 22%)}
@media (max-width:479px){.hero::before{background:linear-gradient(180deg,rgba(10,13,18,.55),rgba(10,13,18,.45))}}
.hero .wrap{position:relative;z-index:2;padding-top:var(--pad-hero);padding-bottom:39px}
.hero-copy{max-width:36rem}
.hero h1{font-size:72px;font-weight:400;line-height:1.05;letter-spacing:-.02em;color:#fff}
.hero-sub{padding:16px 0;font-size:18px;line-height:27px;color:#fff}
.lead-form{width:540px;max-width:100%;background:#fff;border:1px solid #d1d5db;border-radius:20px;padding:24px;color:var(--ink)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px}
.f-in{position:relative}
.f-in svg{position:absolute;left:16px;top:50%;width:14px;height:14px;transform:translateY(-50%);color:#4b5563;pointer-events:none}
.f-in input{width:100%;min-height:48px;padding:8px 12px 8px 40px;border:1px solid rgba(0,0,0,.05);border-radius:999px;background:#fff;font-size:14px;line-height:20px;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.07);outline:none;transition:border-color .2s}
.f-in input::placeholder{color:rgba(75,85,99,.6)}
.f-in input:focus{border-color:var(--accent)}
.consent{display:flex;align-items:flex-start;cursor:pointer;margin-bottom:16px}
.consent input{position:absolute;opacity:0;width:1px;height:1px}
.consent .box{flex:none;width:16px;height:16px;margin-top:4px;border:1px solid #d1d5db;border-radius:4px;background:#fff;display:grid;place-items:center}
.consent .box svg{width:10px;height:10px;opacity:0;color:var(--ink)}
.consent input:checked+.box svg{opacity:1}
.consent p{max-width:90%;margin-left:16px;font-size:12px;line-height:16px;color:#6b7280}
.consent a{color:#2d62ff;color:var(--accent)}
.btn-submit{display:block;width:100%;min-height:56px;margin-bottom:16px;padding:14px 20px 12px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:18px;line-height:27px;cursor:pointer;box-shadow:0 2px 4px -2px rgba(10,13,18,.06),0 5px 15px color-mix(in srgb,var(--accent) 25%,transparent)}
.notice{display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;line-height:20px;color:#111827}
.notice i{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 1px 3px rgba(22,163,74,.5)}
.form-done{display:none;text-align:center;font-size:14px;color:#16a34a;margin-top:-6px;margin-bottom:10px}
.lead-form.sent .form-done{display:block}

/* ===== Headings ===== */
.h2{font-size:36px;font-weight:500;line-height:1.3;color:var(--ink)}
.h2-xl{font-size:clamp(2rem, 1.0714rem + 2.1429vw, 3rem);font-weight:500;line-height:1.25;letter-spacing:-.02em;color:var(--ink)}
.muted{opacity:.6}

/* ===== Reviews ===== */
.reviews{padding:var(--pad-l) 0}
.rv-wrap{max-width:1200px;margin:clamp(1.5rem, 1.2143rem + 1.4286vw, 2.5rem) auto 0}
.rv-track{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.rv-track::-webkit-scrollbar{display:none}
.rv{flex:0 0 calc((100% - 44px)/3);scroll-snap-align:start;min-height:248px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;container-type:inline-size}
.rv-in{display:grid;grid-template-columns:40px 1fr;column-gap:12px;align-content:start}
.rv .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;color:#fff;background:var(--accent)}
.rv .who{padding-top:1px}
.rv .nm{display:block;font-size:15px;font-weight:600;line-height:18px;color:#111}
.rv .when{display:block;margin-top:4px;font-size:12px;line-height:16px;color:rgba(17,17,17,.5)}
.rv .body{grid-column:1/-1}
@container (min-width:320px){.rv .body{grid-column:2}}
.stars{display:flex;gap:0;margin:12px 0 10px;color:#111}
.stars svg{width:17px;height:17px}
.rv .txt{font-size:14px;line-height:20px;color:#111;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.rv.open .txt{-webkit-line-clamp:unset;display:block}
.rv .more[hidden]{display:none}
.rv .more{display:block;border:0;background:none;padding:0;font-size:14px;line-height:20px;color:#006dff;color:var(--accent);cursor:pointer}
.dots{display:flex;justify-content:center;align-items:center;gap:4px;height:27px}
.dots button{width:4px;height:4px;padding:0;border:0;border-radius:50%;background:rgba(17,17,17,.3);cursor:pointer}
.dots button.on{width:6px;height:6px;background:#111}

/* ===== How it works ===== */
.how{padding:var(--pad-l) 0}
.how-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:32px}
.how-grid img{width:100%;aspect-ratio:411/248;object-fit:cover;border-radius:16px}
.how-grid h3{margin-top:16px;font-size:20px;font-weight:600;line-height:30px;color:var(--ink)}
.how-grid p{margin-top:4px;color:var(--body)}

/* ===== More than just ===== */
.more{background:var(--mist)}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px;margin-top:48px;padding-top:16px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:center;font-size:14px;font-weight:500;line-height:21px;color:var(--ink);text-decoration:none;transition:transform .8s}
.tile:hover{transform:translateY(-.5rem)}
.tile-card{position:relative;aspect-ratio:169/198;background:#fff;border-radius:22px;display:grid;place-items:center}
.tile-card img{width:74%;aspect-ratio:1;object-fit:contain;position:relative;z-index:1;margin-top:-8%}
.tile-card::after{content:"";position:absolute;left:18%;right:18%;bottom:15%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.18),rgba(0,0,0,0))}

/* ===== Big image + statement ===== */
.quote{padding-top:var(--pad-l)}
.quote-img{width:100%;aspect-ratio:1280/533;object-fit:cover;border-radius:24px}
.quote-text{max-width:56rem;margin:64px auto 0;text-align:center;font-size:60px;font-weight:400;line-height:1.1;color:var(--ink)}

/* ===== Badge marquee ===== */
.badges{background:var(--mist);padding:var(--pad-m) 0;overflow:hidden}
.b-row{display:flex;width:max-content;gap:24px;animation:slide 60s linear infinite}
.b-row+.b-row{margin-top:16px;animation-direction:reverse;animation-duration:66s}
.b-set{display:flex;gap:24px;flex:none}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 12px))}}
.pill{display:flex;align-items:center;gap:14px;height:72px;padding:0 26px 0 18px;border-radius:999px;font-size:18px;font-weight:500;line-height:27px;color:#0e121b;white-space:nowrap}
.pill img{width:44px;height:44px;object-fit:contain}
.pill.pink{background:var(--pill-pink)}.pill.cyan{background:var(--pill-cyan)}.pill.yellow{background:var(--pill-yellow)}.pill.green{background:var(--pill-green)}

/* ===== FAQ ===== */
.faq{padding:var(--pad-m) 0 var(--pad-l)}
.faq-list{margin-top:48px}
.qa{border:1px solid #d1d5db;border-radius:24px;padding:24px;margin-bottom:24px;background:transparent}
.qa summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;font-size:clamp(1rem, .9643rem + .1786vw, 1.125rem);font-weight:500;line-height:1.56;color:#222}
.qa summary::-webkit-details-marker{display:none}
.qa summary svg{flex:none;width:12px;height:12px;transition:transform .3s}
.qa[open] summary svg{transform:rotate(180deg)}
.qa p{margin-top:16px;max-width:1134px;color:var(--body)}

/* ===== Blog ===== */
.blog{padding-bottom:var(--pad-l)}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.post{display:grid;grid-template-rows:max-content 1fr;background:var(--sand);border-radius:16px;overflow:hidden;color:var(--ink);text-decoration:none;transition:transform .8s cubic-bezier(.175,.885,.32,1.275)}
.post:hover{transform:translateY(-.5rem)}
.post img{width:100%;aspect-ratio:3/2;object-fit:cover}
.post-c{display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:32px}
.post-top{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.tag{padding:2px 10px;border:1px solid var(--line);border-radius:999px;background:#f9fafb;font-size:14px;font-weight:500;line-height:21px;color:#374151}
.post h3{font-size:clamp(1rem, .9643rem + .1786vw, 1.125rem);font-weight:500;line-height:1.56;color:var(--ink)}
.post .ex{font-size:14px;line-height:20.02px;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .lm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;line-height:20.02px;color:#292d49}
.post .lm svg{width:16px;height:16px}
.author{display:flex;align-items:center;gap:16px}
.author .av{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;font-size:15px;font-weight:600;color:#fff;background:var(--accent)}
.author b{display:block;font-size:16px;font-weight:500;line-height:24px}
.author small{display:block;font-size:14px;line-height:20.02px;color:var(--body)}
.blog-cta{display:flex;justify-content:center;margin-top:48px}
.btn-pill{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:999px;background:var(--accent);color:#fff;font-size:16px;font-weight:500;line-height:32px;text-decoration:none}
.btn-pill svg{width:16px;height:16px}

/* ===== Footer ===== */
.foot-wrap{background:#fff;padding:0 16px}
.foot{background:#fff;border-radius:2rem 2rem 0 0;padding:32px 0}
.f-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.25fr;gap:24px}
.f-brand{display:flex;flex-direction:column;gap:32px;align-items:flex-start}
.f-logo{display:flex;align-items:center;gap:8px;height:40px;color:var(--ink);text-decoration:none}
.f-logo img{height:40px;width:auto;max-width:200px;object-fit:contain}
.f-logo .word{font-size:24px;font-weight:600;letter-spacing:-.02em}
.f-logo .mark{width:36px;height:36px}
.f-logo .mark svg{width:100%;height:100%;display:block}
.f-phone{font-size:16px;font-weight:500;line-height:24px;color:#000;text-decoration:none}
.f-col{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.f-title{font-size:14px;line-height:21px;color:#737373}
.f-link{font-size:14px;line-height:21px;color:#0a0a0a;text-decoration:none}
.f-link:hover{text-decoration:underline}
.f-badge{justify-self:end;width:100%;max-width:237px;aspect-ratio:237/48;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11px;line-height:14px;color:#4b5563;text-decoration:none}
.f-badge .g{flex:none;font-size:22px;font-weight:700;color:var(--accent)}
.f-badge .st{display:flex;gap:1px;color:#fbbc04}
.f-badge .st svg{width:12px;height:12px}
.f-badge img{flex:none;width:26px;height:26px}
.f-badge b{display:block;font-size:12px;line-height:15px;color:#111827;font-weight:500}
.f-div{height:1px;background:#e5e5e5;margin:24px 0}
.f-loc{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.25fr;gap:24px;align-items:start}
.f-loc .list{grid-column:2/5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,auto);grid-auto-flow:column;column-gap:24px;row-gap:8px}
.f-legal{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:14px;line-height:20.02px;color:#4b5563}
.f-legal .f-link{opacity:.7}
.credits{display:inline}
.credits summary{display:inline;cursor:pointer;list-style:none}
.credits summary::-webkit-details-marker{display:none}
.credits a{color:inherit}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;transition:all .3s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Responsive ===== */
@media (max-width:991px){
  .menu,.nav-right .phone-pill.desk{display:none}
  .burger{display:flex}
  .nav{top:0;padding:0}
  .nav-inner{border-radius:0;padding:0 var(--gutter)}
  .nav-inner::before{border-radius:0}
  .mnav{display:block;position:fixed;z-index:49;top:64px;left:0;right:0;background:#fff;padding:8px var(--gutter) 20px;box-shadow:0 12px 24px rgba(17,24,39,.12);transform:translateY(-8px);opacity:0;visibility:hidden;transition:all .25s}
  .mnav.open{transform:none;opacity:1;visibility:visible}
  .mnav a{display:block;padding:14px 0;border-bottom:1px solid #f1f1f1;font-size:16px;font-weight:500;color:var(--nav-ink);text-decoration:none}
  .tiles{display:flex;overflow-x:auto;padding-bottom:16px;scrollbar-width:none}
  .tiles::-webkit-scrollbar{display:none}
  .tile{flex:none;width:10rem;max-width:10rem}
  .foot-wrap{padding:0}
  .post-c{padding-left:24px;padding-right:24px}
}
@media (max-width:767px){
  .hero h1{font-size:3rem}
  .rv{flex-basis:calc((100% - 22px)/2)}
  .how-grid{grid-template-columns:1fr;row-gap:56px}
  .quote-img{aspect-ratio:2/1.75;border-radius:2rem}
  .quote-text{margin-top:2rem;font-size:2rem}
  .posts{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:16px;margin-right:calc(var(--gutter)*-1);padding-right:var(--gutter)}
  .posts::-webkit-scrollbar{display:none}
  .post{flex:0 0 85%;scroll-snap-align:start}
  .f-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .f-top>div:empty{display:none}
  .f-brand{grid-column:1/-1}
  .f-badge{justify-self:start}
  .f-loc{grid-template-columns:1fr}
  .f-loc .list{grid-column:auto;grid-template-columns:1fr 1fr;grid-template-rows:none;grid-auto-flow:row}
}
@media (max-width:479px){
  .hero{max-width:100%;border-radius:0;min-height:50vh;display:flex;flex-direction:column;justify-content:flex-end;padding-top:2rem}
  .hero .wrap{padding-bottom:20px}
  .hero-copy{text-align:center}
  .hero h1{font-size:36px}
  .hero-sub{font-size:16px;line-height:24px}
  .lead-form{padding:20.8px;margin-top:16px}
  .consent p{max-width:82%}
  .h2{font-size:30px}
  .faq-list{margin-top:24px}
  .how{padding-bottom:calc(var(--pad-l) + 32px)}
  .f-brand{gap:20px}
  .f-legal>span:first-child{flex-basis:100%}
  .rv{flex-basis:100%}
  .tiles{margin-top:24px}
  .quote-img{border-radius:1.5rem}
  .quote-text{margin:40px auto 0;font-size:30px}
  .post{flex-basis:302px}
  .post-c{padding:16px 12px}
  .tag{padding:1px 8px;font-size:12px;line-height:18px}
  .post h3{font-size:18px}
  .blog-cta .btn-pill{width:100%;justify-content:center}
  .blog-cta{margin-top:24px}
  .phone-pill{min-height:36px}
}
@media (prefers-reduced-motion:reduce){.b-row{animation:none}.tile,.post{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>/*__DEMO__*/</script>
<script>
const D = window.DEMO, S = D.settings, P = D.presets[S.niche] || Object.values(D.presets)[0], A = D.about || {};
const IMG = S.images || {};

  return word;
}
function navLogo(){
  if (S.logoMark || !(S.logoUrl || S.logoUrlDark)) return `<a href="#top" class="logo" aria-label="${esc(brand)} home">${logoInner(true)}</a>`;

/* ---------- behaviour ---------- */
const nav = document.getElementById("nav");

const burger = document.getElementById("burger"), mnav = document.getElementById("mnav");
burger.addEventListener("click", () => { const o = mnav.classList.toggle("open"); burger.setAttribute("aria-expanded", o); onScroll(); });
mnav.addEventListener("click", e => { if (e.target.closest("a")) { mnav.classList.remove("open"); burger.setAttribute("aria-expanded", "false"); onScroll(); } });

const toastEl = document.getElementById("toast");
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove("show"), 2600); }
document.addEventListener("click", e => { if (e.target.closest("[data-soon]")) { e.preventDefault(); toast("This page is part of the full site build."); } });

const form = document.getElementById("contactForm");
form.addEventListener("submit", e => {
  e.preventDefault();
  const bad = [...form.querySelectorAll("input[required]")].find(i => !i.value.trim());
  if (bad) { bad.focus(); toast("Please fill in your name, email and phone."); return; }
  form.classList.add("sent"); form.reset();
});

const track = document.getElementById("rvTrack"), dots = [...document.querySelectorAll("#rvDots button")];
document.querySelectorAll(".rv .more").forEach(b => {
  const card = b.closest(".rv"), txt = card.querySelector(".txt");
  const check = () => { b.hidden = !card.classList.contains("open") && txt.scrollHeight <= txt.clientHeight + 1; };
  b.addEventListener("click", () => { card.classList.toggle("open"); b.textContent = card.classList.contains("open") ? "Read less" : "Read more"; check(); });
  check(); addEventListener("resize", check); if (document.fonts) document.fonts.ready.then(check);
});
if (track) {
  dots.forEach((d, i) => d.addEventListener("click", () => { const c = track.children[i]; track.scrollTo({ left: c.offsetLeft - track.offsetLeft, behavior: "smooth" }); }));
  track.addEventListener("scroll", () => { const w = track.children[0] ? track.children[0].offsetWidth + 22 : 1; const i = Math.round(track.scrollLeft / w); dots.forEach((d, j) => d.classList.toggle("on", j === i)); }, { passive: true });
}

function fitH1(){
  const h = document.getElementById("h1"); if (!h) return;
  h.style.fontSize = "";
  let size = parseFloat(getComputedStyle(h).fontSize), n = 0;
  const over = () => h.scrollWidth > h.parentElement.clientWidth + 1;
  while (over() && size > 18 && n++ < 40) { size *= 0.96; h.style.fontSize = size + "px"; }
}
fitH1(); addEventListener("resize", fitH1); if (document.fonts) document.fonts.ready.then(fitH1);
